<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>学習プランナー</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--acc:#1a6ef7;--acc2:#5b4ef8;--acc-soft:#e8f0fe;--bg:#f0f4fb;--surface:#fff;--border:#e2e8f4;--text:#0f172a;--muted:#64748b;--r:20px;--rsm:14px;--shadow:0 2px 12px rgba(30,50,120,.08)}
html,body{
height:100%;
background:#e8ecf4;
overflow:hidden;
}
body{display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.app-shell{
width:100%;
max-width:430px;
height:100dvh;
max-height:100dvh;
background:var(--bg);border-radius:var(--r);overflow:hidden;border:0.5px solid var(--border);display:flex;flex-direction:column;box-shadow:0 8px 40px rgba(30,50,120,.15)}
@media(max-width:500px){.app-shell{border-radius:0;max-height:100vh;border:none}}
.topbar{background:var(--surface);padding:14px 18px 0;border-bottom:0.5px solid var(--border);flex-shrink:0}
.topbar-head{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:10px;
gap:8px;
}
.page-small{font-size:12px;font-weight:600;color:var(--acc);letter-spacing:.04em;text-transform:uppercase;margin-bottom:1px}
.page-big{font-size:26px;font-weight:700;letter-spacing:-.5px;transition:opacity .22s,transform .22s}
.top-right{
display:flex;
gap:6px;
align-items:center;
flex-shrink:0;
}
.icon-btn{width:38px;height:38px;border-radius:50%;background:var(--acc-soft);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--acc);font-size:18px;transition:transform .26s cubic-bezier(.34,1.56,.64,1),background .22s,box-shadow .22s}
.icon-btn:hover{background:#d4e4fd;box-shadow:0 2px 10px rgba(26,110,247,.2)}
.icon-btn:active{transform:scale(.88)}
.fab{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:white;font-size:20px;box-shadow:0 4px 14px rgba(26,110,247,.35);transition:transform .26s cubic-bezier(.34,1.56,.64,1),box-shadow .26s}
.fab:hover{transform:scale(1.08);box-shadow:0 6px 20px rgba(26,110,247,.45)}
.fab:active{transform:scale(.88);box-shadow:0 2px 8px rgba(26,110,247,.2)}
.mode-strip{display:flex;background:var(--bg);border-radius:50px;padding:3px;margin-bottom:10px;border:0.5px solid var(--border)}
.mode-btn{flex:1;padding:5px 0;font-size:12px;font-weight:500;border:none;background:none;cursor:pointer;border-radius:50px;color:var(--muted);font-family:inherit;transition:background .28s,color .28s,transform .22s}
.mode-btn.active{background:var(--surface);color:var(--acc);box-shadow:var(--shadow)}
.mode-btn:active{transform:scale(.95)}
.week-strip{display:flex;gap:1px}
.wd{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0 10px;flex:1;cursor:pointer;border-bottom:2.5px solid transparent;transition:border-color .35s}
.wd.active{border-bottom-color:var(--acc)}
.wd-label{font-size:10px;color:var(--muted)}
.wd.active .wd-label{color:var(--acc)}
.wd.sat .wd-label{color:#2563eb}
.wd.hol .wd-label,.wd.sun .wd-label{color:#dc2626}
.wd-num{width:27px;height:27px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;transition:background .3s cubic-bezier(.34,1.56,.64,1),color .3s,transform .3s cubic-bezier(.34,1.56,.64,1)}
.wd.active .wd-num{background:var(--acc);color:white;transform:scale(1.15)}
.wd.today-dot .wd-num{background:rgba(26,110,247,.13);color:var(--acc);border-radius:50%;}
.wd.sun .wd-num,.wd.hol .wd-num{color:#dc2626}
.wd.sat .wd-num{color:#2563eb}
.hol-label{font-size:8px;color:#dc2626;max-width:36px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-align:center}
.month-grid{padding:8px 0 12px}
.month-header{display:grid;grid-template-columns:repeat(7,1fr);font-size:11px;font-weight:500;text-align:center;color:var(--muted);margin-bottom:4px;padding:0 2px}
.month-days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:0 2px}
.mc{display:flex;flex-direction:column;align-items:center;padding:4px 2px;border-radius:10px;cursor:pointer;transition:background .22s,transform .22s;min-height:36px}
.mc:hover{background:var(--acc-soft)}
.mc:active{transform:scale(.9)}
.mc.active .mc-num{background:var(--acc);color:white;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.mc.today-dot .mc-num{background:rgba(26,110,247,.13);color:var(--acc);border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.mc.other-month{opacity:.3}
.mc.hol .mc-num,.mc.sun .mc-num{color:#dc2626}
.mc.sat .mc-num{color:#2563eb}
.mc-dot{width:4px;height:4px;border-radius:50%;margin-top:2px}
.bottomnav{display:flex;background:var(--surface);border-top:0.5px solid var(--border);padding:8px 4px 10px;flex-shrink:0}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:none;background:none;cursor:pointer;padding:4px 0;color:var(--muted);font-size:10px;font-family:inherit;transition:color .28s,transform .28s cubic-bezier(.34,1.56,.64,1)}
.bnav-btn i{font-size:21px;padding:3px 13px;border-radius:50px;transition:background .28s,transform .35s cubic-bezier(.34,1.56,.64,1)}
.bnav-btn.active{color:var(--acc)}
.bnav-btn.active i{background:var(--acc-soft);transform:translateY(-2px) scale(1.08)}
.bnav-btn:active{transform:scale(.88)}
.content{flex:1;overflow-y:auto;background:var(--bg);position:relative}
.view{display:none}
.view.active{display:block}
.view.slide-left{animation:slideInLeft .44s cubic-bezier(.16,1,.3,1)}
.view.slide-right{animation:slideInRight .44s cubic-bezier(.16,1,.3,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@keyframes slideInLeft{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes slideInRight{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
.timeline-wrap{padding:8px 0 12px}
.tl-row{display:grid;grid-template-columns:52px 1fr;min-height:56px}
.tl-label{font-size:11px;color:var(--muted);padding:3px 8px 0 0;text-align:right}
.tl-track{border-top:0.5px solid var(--border);padding:4px 14px 0 10px;position:relative}
.tl-now-line{position:absolute;left:0;right:14px;height:2px;background:linear-gradient(90deg,#ef4444,#f97316);border-radius:1px;z-index:2;pointer-events:none}
.tl-now-dot{position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:#ef4444;animation:dotPulse 2s ease-in-out infinite}
.ev{border-radius:12px;padding:8px 12px;margin-bottom:4px;cursor:pointer;transition:transform .28s cubic-bezier(.34,1.56,.64,1),box-shadow .28s,opacity .22s;box-shadow:0 1px 4px rgba(0,0,0,.06);animation:rowIn .36s cubic-bezier(.16,1,.3,1) both}
.ev:hover{transform:translateY(-2px) scale(1.01);box-shadow:0 6px 16px rgba(0,0,0,.1)}
.ev:active{transform:scale(.97);opacity:.85}
.ev-class{background:linear-gradient(135deg,#eff6ff,#e8f0fe);border-left:3px solid var(--acc)}
.ev-routine{background:linear-gradient(135deg,#ecfdf5,#d1fae5);border-left:3px solid #059669}
.ev-todo{background:linear-gradient(135deg,#fff7ed,#fef3c7);border-left:3px solid #d97706}
.ev-title{font-size:13px;font-weight:600}
.ev-time{font-size:11px;color:var(--muted);margin-top:2px}
.ev-class .ev-title{color:#1e40af}
.ev-routine .ev-title{color:#065f46}
.ev-todo .ev-title{color:#92400e}
.school-panel{overflow:hidden;max-height:0;transition:max-height .5s cubic-bezier(.16,1,.3,1),opacity .4s;opacity:0;background:var(--surface);border-radius:var(--r);margin:0 12px 8px;border:0.5px solid #bfdbfe;box-shadow:var(--shadow)}
.school-panel.open{max-height:600px;opacity:1}
.school-toggle{display:flex;align-items:center;justify-content:space-between;margin:0 12px 6px;padding:11px 14px;background:var(--surface);border-radius:var(--r);border:0.5px solid var(--border);box-shadow:var(--shadow);cursor:pointer;transition:background .22s}
.school-toggle:active{background:var(--acc-soft)}
.school-toggle-left{display:flex;align-items:center;gap:8px}
.school-toggle-icon{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#eff6ff,#e8f0fe);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--acc);flex-shrink:0}
.school-toggle-label{font-size:13px;font-weight:600;color:var(--text)}
.school-toggle-sub{font-size:11px;color:var(--muted);margin-top:1px}
.school-toggle-arrow{font-size:16px;color:var(--muted);transition:transform .44s cubic-bezier(.16,1,.3,1)}
.school-toggle-arrow.open{transform:rotate(180deg)}
.sp-row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:0.5px solid var(--border)}
.sp-row:last-child{border-bottom:none}
.off-banner{margin:14px;background:linear-gradient(135deg,#fef2f2,#fee2e2);border:0.5px solid #fca5a5;border-radius:var(--r);padding:16px;display:flex;align-items:center;gap:12px}
.sec-title{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;padding:14px 16px 7px}
.card{background:var(--surface);border-radius:var(--r);margin:0 12px 12px;border:0.5px solid var(--border);overflow:hidden;box-shadow:var(--shadow);animation:cardIn .44s cubic-bezier(.16,1,.3,1) both}
.card-row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:0.5px solid var(--border);transition:background .22s,transform .22s}
.card-row:active{background:var(--acc-soft);transform:scale(.99)}
.card-row:last-child{border-bottom:none}
.dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.pill{font-size:11px;padding:3px 10px;border-radius:50px;font-weight:500;white-space:nowrap}
.pill-blue{background:#eff6ff;color:#1d4ed8}
.pill-green{background:#ecfdf5;color:#065f46}
.pill-amber{background:#fff7ed;color:#92400e}
.cd-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;padding:0 12px 16px}
.cd-card{background:var(--surface);border-radius:var(--r);padding:14px;border:0.5px solid var(--border);transition:transform .28s cubic-bezier(.34,1.56,.64,1),box-shadow .28s;box-shadow:var(--shadow);animation:popIn .4s cubic-bezier(.16,1,.3,1) both}
.cd-card:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 8px 24px rgba(26,110,247,.15)}
.cd-card:active{transform:scale(.96)}
.cd-num{font-size:32px;font-weight:700;line-height:1;background:linear-gradient(135deg,var(--acc),var(--acc2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.cd-num.urgent{background:linear-gradient(135deg,#dc2626,#f97316);-webkit-background-clip:text}
.tt-wrap{overflow-x:auto;padding:0 12px 16px}
.tt-grid{display:grid;grid-template-columns:52px repeat(6,1fr);gap:3px;min-width:360px;font-size:10px}
.tt-head.tt-head-empty{background:transparent;border:none;box-shadow:none}
.tt-head{text-align:center;padding:6px 2px;font-weight:600;color:var(--muted);background:var(--surface);border-radius:10px;font-size:11px}
.tt-head.tcol{color:var(--acc);background:var(--acc-soft)}
.tt-time-cell{color:var(--muted);text-align:right;padding-right:4px;padding-top:4px;line-height:1.5;font-size:9px}
.tt-time-cell .t-limit{font-weight:600;font-size:10px;color:var(--text)}
.tt-time-cell .t-range{font-size:8.5px;color:var(--muted)}
.tt-time-cell .t-sep{font-size:7.5px;color:var(--border);line-height:1}
.tt-cell{background:var(--surface);border-radius:10px;min-height:48px;padding:2px;border:0.5px solid var(--border)}
.tt-cell.tcol{border-color:#bfdbfe;background:#f0f7ff}
.tt-cell.off{background:#fef2f2;border-color:#fecaca}
.tt-item{background:linear-gradient(135deg,#4f46e5,#6366f1);color:white;border-radius:8px;padding:4px 5px;font-size:9px;overflow:hidden;cursor:pointer;transition:transform .26s cubic-bezier(.34,1.56,.64,1),opacity .22s,box-shadow .22s;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;word-break:break-all;line-height:1.3}
.tt-item:hover{transform:scale(1.04);box-shadow:0 4px 10px rgba(79,70,229,.35)}
.tt-item:active{opacity:.75;transform:scale(.96)}
.settings-wrap{padding:12px 12px 24px}
.settings-card{background:var(--surface);border-radius:var(--r);border:0.5px solid var(--border);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden;animation:cardIn .44s cubic-bezier(.16,1,.3,1) both}
.settings-card:nth-child(1){animation-delay:.04s}
.settings-card:nth-child(2){animation-delay:.1s}
.settings-card:nth-child(3){animation-delay:.16s}
.settings-card:nth-child(4){animation-delay:.22s}
.settings-card-header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:0.5px solid var(--border);background:linear-gradient(135deg,var(--acc-soft),#f0f0ff)}
.settings-card-header i{font-size:20px;color:var(--acc)}
.settings-card-header-text{font-size:15px;font-weight:700;color:var(--text)}
.settings-card-body{padding:14px 16px}
.sf-label{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px;margin-top:10px;display:block}
.sf-label:first-child{margin-top:0}
.sf-input{width:100%;font-size:13px;padding:10px 12px;border:0.5px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text);font-family:inherit;transition:border-color .2s,box-shadow .2s}
.sf-input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(26,110,247,.12)}
.sf-row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sf-btn{width:100%;margin-top:12px;padding:11px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:white;border:none;border-radius:50px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:transform .26s cubic-bezier(.34,1.56,.64,1),box-shadow .26s;box-shadow:0 4px 14px rgba(26,110,247,.3);display:flex;align-items:center;justify-content:center;gap:8px}
.sf-btn:hover{box-shadow:0 6px 20px rgba(26,110,247,.45);transform:translateY(-1px)}
.sf-btn:active{transform:scale(.97)}
.day-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-bottom:10px}
.day-btn{padding:7px 2px;border:0.5px solid var(--border);border-radius:10px;background:var(--bg);font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;text-align:center;transition:background .22s,color .15s,border-color .15s,transform .12s;font-family:inherit}
.day-btn.sel{background:var(--acc);color:white;border-color:var(--acc)}
.day-btn:active{transform:scale(.93)}
.period-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:10px}
.period-btn{padding:8px 4px;border:0.5px solid var(--border);border-radius:10px;background:var(--bg);cursor:pointer;text-align:center;transition:background .22s,border-color .15s,transform .12s;font-family:inherit}
.period-btn.sel{background:#eff6ff;border-color:var(--acc)}
.period-btn:active{transform:scale(.93)}
.period-btn .pb-limit{font-size:11px;font-weight:700;color:var(--text)}
.period-btn.sel .pb-limit{color:var(--acc)}
.period-btn .pb-time{font-size:9px;color:var(--muted)}
.reg-list{margin-top:10px}
.reg-item{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:0.5px solid var(--border);animation:rowIn .32s cubic-bezier(.16,1,.3,1) both;transition:opacity .22s,transform .22s}
.reg-item.removing{animation:shrinkOut .3s cubic-bezier(.16,1,.3,1) forwards}
.reg-item:last-child{border-bottom:none}
.del-btn{margin-left:auto;font-size:11px;padding:4px 10px;border:0.5px solid #fca5a5;border-radius:50px;background:none;color:#b91c1c;cursor:pointer;font-family:inherit;transition:transform .18s,background .18s,color .18s;flex-shrink:0}
.del-btn:hover{background:#fef2f2;border-color:#ef4444}
.del-btn:active{transform:scale(.92)}
.empty-reg{font-size:12px;color:var(--muted);text-align:center;padding:12px 0}
.drawer-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.4);align-items:flex-end;backdrop-filter:blur(3px);z-index:100}
.drawer-overlay.open{display:flex;animation:fadeIn .28s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:scale(.85) translateY(8px)}to{opacity:1;transform:none}}
@keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes rowIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes shrinkOut{to{opacity:0;transform:scaleY(0) translateY(-6px);max-height:0;margin:0;padding:0;border:0}}
@keyframes dotPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.4)}}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
.drawer{background:var(--surface);border-radius:var(--r) var(--r) 0 0;padding:20px;width:100%;max-width:430px;margin:0 auto;animation:drawerUp .44s cubic-bezier(.16,1,.3,1)}
@keyframes drawerUp{from{transform:translateY(100%);opacity:0}to{transform:none;opacity:1}}
.drawer-title{font-size:17px;font-weight:700;margin-bottom:16px;background:linear-gradient(135deg,var(--acc),var(--acc2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.dw-input{width:100%;font-size:14px;padding:11px 14px;border:0.5px solid var(--border);border-radius:14px;background:var(--bg);color:var(--text);font-family:inherit;transition:border-color .2s,box-shadow .2s;margin-bottom:10px}
.dw-input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(26,110,247,.12)}
.dw-row{display:flex;gap:8px;margin-top:4px}
.dw-cancel{flex:1;padding:11px;border:0.5px solid var(--border);border-radius:50px;background:none;cursor:pointer;font-family:inherit;font-size:13px;color:var(--muted)}
.dw-submit{flex:2;padding:11px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:white;border:none;border-radius:50px;cursor:pointer;font-family:inherit;font-size:14px;font-weight:600;box-shadow:0 4px 14px rgba(26,110,247,.3);transition:transform .26s cubic-bezier(.34,1.56,.64,1),box-shadow .26s}
.dw-submit:hover{box-shadow:0 6px 20px rgba(26,110,247,.45);transform:translateY(-1px)}
.dw-submit:active{transform:scale(.96)}
.print-btn{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 12px 16px;padding:13px 18px;background:linear-gradient(135deg,#0f172a,#1e293b);color:white;border:none;border-radius:50px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;box-shadow:0 4px 14px rgba(15,23,42,.25);width:calc(100% - 24px);transition:transform .26s cubic-bezier(.34,1.56,.64,1),box-shadow .26s}
.print-btn:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(15,23,42,.35)}
.print-btn:active{transform:scale(.97)}
.empty-state{text-align:center;padding:36px 16px;color:var(--muted);font-size:13px}
@media print{

  @page{
    size:A4;
    margin:12mm;
  }

  html,body{
    width:100%;
    background:white;
    overflow:visible!important;
  }

  body{
    display:block!important;
    margin:0;
    padding:0;
  }

  .app-shell,
  .topbar,
  .bottomnav,
  .content{
    display:none!important;
  }

  #print-area{
    display:block!important;
    position:static!important;
    width:100%;
    max-width:none!important;
    min-height:auto;
    padding:0;
    margin:0 auto;
    font-family:sans-serif;
    color:#000;
    font-size:14px;
    zoom:1;
  }

  .print-header{
    margin-bottom:18px;
  }

  .print-section{
    margin-bottom:16px;
  }

  .print-row{
    padding:10px 0;
    border-bottom:1px solid #eee;
  }
  .print-row:last-child{
    border-bottom:none;
  }
  .print-period-label{
    font-size:12px;
    font-weight:700;
    color:#555;
    margin-bottom:3px;
  }
  .print-time{
    font-size:12px;
    color:#777;
    margin-bottom:4px;
  }
  .print-subject{
    font-size:15px;
    font-weight:700;
    color:#111;
  }
  .print-routine-row,
  .print-task-row{
    display:flex;
    flex-direction:column;
    gap:2px;
    padding:8px 0;
    border-bottom:1px solid #eee;
  }
  .print-routine-row:last-child,
  .print-task-row:last-child{
    border-bottom:none;

<script>
const PERIODS=[
  {l:'1限',s:'08:40',e:'09:25'},{l:'2限',s:'09:35',e:'10:20'},

];
const SAT_MAX=4;
const DN=['日','月','火','水','木','金','土'];
const DAYS_WD=[{d:1,l:'月'},{d:2,l:'火'},{d:3,l:'水'},{d:4,l:'木'},{d:5,l:'金'},{d:6,l:'土'}];
const JP_HOL={
  '2025-01-01':'元日','2025-01-13':'成人の日','2025-02-11':'建国記念の日','2025-02-23':'天皇誕生日','2025-02-24':'振替休日','2025-03-20':'春分の日','2025-04-29':'昭和の日','2025-05-03':'憲法記念日','2025-05-04':'みどりの日','2025-05-05':'こどもの日','2025-05-06':'振替休日','2025-07-21':'海の日','2025-08-11':'山の日','2025-09-15':'敬老の日','2025-09-23':'秋分の日','2025-10-13':'スポーツの日','2025-11-03':'文化の日','2025-11-23':'勤労感謝の日','2025-11-24':'振替休日','2025-12-23':'天皇誕生日',
  '2026-01-01':'元日','2026-01-12':'成人の日','2026-02-11':'建国記念の日','2026-02-23':'天皇誕生日','2026-03-20':'春分の日','2026-04-29':'昭和の日','2026-05-03':'憲法記念日','2026-05-04':'みどりの日','2026-05-05':'こどもの日','2026-05-06':'振替休日','2026-07-20':'海の日','2026-08-11':'山の日','2026-09-21':'敬老の日','2026-09-22':'国民の休日','2026-09-23':'秋分の日','2026-10-12':'スポーツの日','2026-11-03':'文化の日','2026-11-23':'勤労感謝の日'
};

// ── Supabase 設定 ─────────────────────────────────────────
// ▼ ご自身のSupabaseプロジェクトURLとanon keyに置き換えてください
const SUPA_URL = 'https://ymuemcvdatfblrzzrgyc.supabase.co';
const SUPA_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InltdWVtY3ZkYXRmYmxyenpyZ3ljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3MTA3MjQsImV4cCI6MjA5NTI4NjcyNH0.HnEHYmdDfVNYTFsyeFrjvbIpYrZpbO-s6pCd2x1JGv0';
let _sb = null;
try {
  _sb = supabase.createClient(SUPA_URL, SUPA_ANON, {
    auth: { persistSession: true, autoRefreshToken: true }
  });
} catch(e) { console.warn('Supabase init failed (placeholder keys):', e.message); }

let _sbUser = null; // ログイン中ユーザー
let _authTab = 'login';

// ── Auth UI ────────────────────────────────────────────────
function openAuth(){ const ov=document.getElementById('auth-overlay');ov.style.display='flex';requestAnimationFrame(()=>ov.classList.add('open')); }
function closeAuth(){ const ov=document.getElementById('auth-overlay');ov.style.opacity='0';setTimeout(()=>{ov.style.display='none';ov.style.opacity='';ov.classList.remove('open');},250); }
function switchAuthTab(tab){
  _authTab=tab;
  document.getElementById('auth-tab-login').classList.toggle('active',tab==='login');
  document.getElementById('auth-tab-signup').classList.toggle('active',tab==='signup');
  document.getElementById('auth-submit-btn').textContent=tab==='login'?'ログイン':'アカウントを作成';
  document.getElementById('auth-err').textContent='';
}
async function doAuth(){
  if(!_sb){document.getElementById('auth-err').textContent='Supabaseの設定が必要です（README参照）';return;}
  const email=document.getElementById('auth-email').value.trim();
  const password=document.getElementById('auth-password').value;
  const btn=document.getElementById('auth-submit-btn');
  if(!email||!password){document.getElementById('auth-err').textContent='メールとパスワードを入力してください';return;}
  btn.disabled=true;btn.textContent='処理中...';
  document.getElementById('auth-err').textContent='';
  let err;
  if(_authTab==='login'){
    ({error:err}=await _sb.auth.signInWithPassword({email,password}));
  } else {
    ({error:err}=await _sb.auth.signUp({email,password}));
  }
  btn.disabled=false;
  switchAuthTab(_authTab);
  if(err){document.getElementById('auth-err').textContent=_authErrMsg(err.message);return;}
  if(_authTab==='signup'){document.getElementById('auth-err').style.color='#059669';document.getElementById('auth-err').textContent='確認メールを送りました。メールを確認してください。';return;}
  closeAuth();
}
function _authErrMsg(m){
  if(m.includes('Invalid login'))return 'メールまたはパスワードが違います';
  if(m.includes('Email not confirmed'))return 'メールアドレスを確認してください';
  if(m.includes('already registered'))return 'このメールアドレスはすでに登録済みです';
  if(m.includes('Password should'))return 'パスワードは6文字以上にしてください';
  return m;
}
async function doLogout(){
  if(!_sb)return;
  await _sb.auth.signOut();
  _sbUser=null;
  if(currentTab==='settings')buildSettings();
}

// ── Supabase データ同期 ─────────────────────────────────────
async function syncToCloud(){
  if(!_sbUser||!_sb)return false;
  const uid=_sbUser.id;
  const payload={
    user_id:uid, classes:JSON.stringify(classes), routines:JSON.stringify(routines),
    tasks:JSON.stringify(tasks), tests:JSON.stringify(tests), holidays:JSON.stringify(holidays),
    updated_at:new Date().toISOString()
  };
  const {error}=await _sb.from('planner_data').upsert(payload,{onConflict:'user_id'});
  return !error;
}
async function syncFromCloud(){
  if(!_sbUser||!_sb)return false;
  const {data,error}=await _sb.from('planner_data').select('*').eq('user_id',_sbUser.id).single();
  if(error||!data)return false;
  try{
    classes=JSON.parse(data.classes||'[]');
    routines=JSON.parse(data.routines||'[]');
    tasks=JSON.parse(data.tasks||'[]');
    tests=JSON.parse(data.tests||'[]');
    holidays=JSON.parse(data.holidays||'[]');
    sv(); // ローカルにも保存
    if(currentTab==='today')buildToday();
    else if(currentTab==='tt')buildTT();
    else if(currentTab==='routine')buildRoutineList();
    else if(currentTab==='task')buildTaskList();
    updateCal();
    return true;
  }catch(e){return false;}
}
async function doSync(){
  const btn=document.querySelector('.acct-sync-btn');
  if(btn){btn.classList.add('syncing');}
  const ok=await syncToCloud();
  if(btn){btn.classList.remove('syncing');btn.querySelector('span').textContent=ok?'同期完了':'同期失敗';}
  setTimeout(()=>{if(btn)btn.querySelector('span').textContent='クラウド同期';},2000);
}

// ── ログイン状態の購読 ─────────────────────────────────────
async function initAuth(){
  if(!_sb)return;
  const {data:{session}}=await _sb.auth.getSession();
  if(session){_sbUser=session.user;await syncFromCloud();}
  _sb.auth.onAuthStateChange((_event,session)=>{
    _sbUser=session?.user||null;
    if(_sbUser)syncFromCloud();
    if(currentTab==='settings')buildSettings();
  });
}

// ── sv() をクラウド同期対応に上書き ───────────────────────

let routines=JSON.parse(localStorage.getItem('sp_rt')||'[]');
let tasks=JSON.parse(localStorage.getItem('sp_tk')||'[]');
let tests=JSON.parse(localStorage.getItem('sp_te')||'[]');
let holidays=JSON.parse(localStorage.getItem('sp_hol')||'[]');
let sfDay=1,sfPeriod=0;

function sv(){
  try{localStorage.setItem('sp_cl',JSON.stringify(classes))}catch(e){}
  try{localStorage.setItem('sp_rt',JSON.stringify(routines))}catch(e){}
  try{localStorage.setItem('sp_tk',JSON.stringify(tasks))}catch(e){}
  try{localStorage.setItem('sp_te',JSON.stringify(tests))}catch(e){}
  try{localStorage.setItem('sp_hol',JSON.stringify(holidays))}catch(e){}
  if(_sbUser)syncToCloud(); // クラウドにも反映
}

let currentTab='today',calMode='week',prevTabIdx=0;
let selDS=toDS(new Date()),selDow=new Date().getDay();
let weekOff=0,monthOff=0,schoolOpen=false;

function toDS(d){return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
function z(n){return String(n).padStart(2,'0')}
function tm(t){const[h,m]=t.split(':').map(Number);return h*60+m}
function mt(m){return z(Math.floor(m/60))+':'+z(m%60)}
function isHol(ds){return !!JP_HOL[ds]||holidays.some(h=>h.date===ds)}
function holN(ds){const c=holidays.find(h=>h.date===ds);return c?c.name||'休校日':JP_HOL[ds]||'祝日'}
function isOff(ds){const d=new Date(ds+'T00:00:00');return d.getDay()===0||isHol(ds)}

function setMode(m){
  calMode=m;
  document.getElementById('mode-week').classList.toggle('active',m==='week');
  document.getElementById('mode-month').classList.toggle('active',m==='month');
  if(m==='month'){const p=selDS.split('-');document.getElementById('page-big').textContent=`${p[0]}年${parseInt(p[1])}月`;document.getElementById('page-small').textContent='月間表示';}
  updateCal();
}
function prevPeriod(){calMode==='week'?weekOff--:monthOff--;updateCal();}
function nextPeriod(){calMode==='week'?weekOff++:monthOff++;updateCal();}
function updateCal(){calMode==='week'?buildWeek():buildMonth();}

function buildWeek(){
  const now=new Date();
  const base=new Date(now);base.setDate(now.getDate()-((now.getDay()+6)%7)+weekOff*7);
  let h='';
  for(let i=0;i<7;i++){
    const d=new Date(base);d.setDate(base.getDate()+i);
    const dd=d.getDay(),ds=toDS(d);
    const isSel=ds===selDS,isToday=d.toDateString()===now.toDateString();
    const hol=isHol(ds),isSun=dd===0,isSat=dd===6;
    let cls='wd';
    if(isSel)cls+=' active';if(isToday)cls+=' today-dot';
    if(isSun||hol)cls+=' hol';else if(isSat)cls+=' sat';
    h+=`<div class="${cls}" onclick="selDay(${dd},'${ds}')"><div class="wd-label">${DN[dd]}</div><div class="wd-num">${d.getDate()}</div>${hol?`<div class="hol-label">${holN(ds)}</div>`:''}</div>`;
  }
  document.getElementById('cal-area').innerHTML=`<div class="week-strip">${h}</div>`;
}

function buildMonth(){
  const now=new Date();
  const base=new Date(now.getFullYear(),now.getMonth()+monthOff,1);
  const yr=base.getFullYear(),mo=base.getMonth();
  document.getElementById('page-big').textContent=`${yr}年${mo+1}月`;
  document.getElementById('page-small').textContent='月間表示';
  const fd=(base.getDay()+6)%7,dim=new Date(yr,mo+1,0).getDate(),pdim=new Date(yr,mo,0).getDate();
  let h=`<div class="month-grid"><div class="month-header">`;
  ['月','火','水','木','金','土','日'].forEach((d,i)=>{h+=`<div style="color:${i===5?'#2563eb':i===6?'#dc2626':'var(--muted)'};font-size:11px;text-align:center">${d}</div>`;});
  h+='</div><div class="month-days">';
  for(let i=0;i<fd;i++)h+=`<div class="mc other-month"><span class="mc-num" style="font-size:12px">${pdim-fd+1+i}</span></div>`;
  for(let d=1;d<=dim;d++){
    const ds=`${yr}-${z(mo+1)}-${z(d)}`;
    const date=new Date(yr,mo,d),dow=date.getDay();
    const isToday=ds===toDS(now),isSel=ds===selDS;
    const hol=isHol(ds),isSun=dow===0,isSat=dow===6;
    let cls='mc';
    if(isSel)cls+=' active';if(isToday)cls+=' today-dot';
    if(isSun||hol)cls+=' hol';else if(isSat)cls+=' sat';
    const tDot=tests.some(t=>ds>=t.start&&ds<=t.end);
    const cDot=classes.some(c=>c.day==dow);
    h+=`<div class="${cls}" onclick="selDayM('${ds}',${dow})"><span class="mc-num" style="font-size:12px">${d}</span>${(cDot||tDot)?`<div style="display:flex;gap:2px">${cDot?`<div class="mc-dot" style="background:var(--acc)"></div>`:''}${tDot?`<div class="mc-dot" style="background:#dc2626"></div>`:''}</div>`:''}</div>`;
  }
  const rem=(fd+dim)%7===0?0:7-(fd+dim)%7;
  for(let i=1;i<=rem;i++)h+=`<div class="mc other-month"><span class="mc-num" style="font-size:12px">${i}</span></div>`;
  h+='</div></div>';
  document.getElementById('cal-area').innerHTML=h;
}

function selDay(dd,ds){selDow=dd;selDS=ds;updateCal();fadeDateTo(ds);closeSchool();if(currentTab==='today')buildToday();}
function selDayM(ds,dow){
  selDow=dow;selDS=ds;
  const now=new Date(),sel=new Date(ds+'T00:00:00');
  const diff=Math.round((sel-now)/86400000);
  const nd=(now.getDay()+6)%7,sd=(dow+6)%7;
  weekOff=Math.floor((diff+nd-sd)/7);
  calMode='week';
  document.getElementById('mode-week').classList.add('active');
  document.getElementById('mode-month').classList.remove('active');
  buildWeek();fadeDateTo(ds);if(currentTab==='today')buildToday();
}
function fadeDateTo(ds){
  const pg=document.getElementById('page-big');
  pg.style.opacity='0';pg.style.transform='translateY(4px)';
  setTimeout(()=>{const p=ds.split('-');pg.textContent=`${parseInt(p[1])}月${parseInt(p[2])}日`;pg.style.opacity='1';pg.style.transform='none';},120);
  if(currentTab==='today')document.getElementById('page-small').textContent='今日';
}

function setTab(t,label,idx){
  const dir=idx>prevTabIdx?'slide-left':'slide-right';prevTabIdx=idx;
  currentTab=t;
  document.querySelectorAll('.bnav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('bnav-'+t).classList.add('active');
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active','slide-left','slide-right'));
  const vEl=document.getElementById('view-'+t);
  requestAnimationFrame(()=>{vEl.classList.add('active');if(t!=='today')vEl.classList.add(dir);setTimeout(()=>vEl.classList.remove('slide-left','slide-right'),350);});
  if(t!=='today'){
    document.getElementById('page-small').textContent=label;
    const pg=document.getElementById('page-big');pg.style.opacity='0';setTimeout(()=>{pg.textContent='';pg.style.opacity='1';},120);
  } else {document.getElementById('page-small').textContent='今日';fadeDateTo(selDS);}
  closeSchool();
  if(t==='today'){buildToday();updateCal();}
  else if(t==='tt')buildTT();
  else if(t==='routine')buildRoutineList();
  else if(t==='task')buildTaskList();
  else if(t==='settings')buildSettings();
}

function buildToday(){
  const dow=selDow,isSat=dow===6,off=isOff(selDS);
  let inner='';
  if(off){
    const reason=dow===0?'日曜日':holN(selDS);
    inner+=`<div class="off-banner"><div style="font-size:28px">🏖️</div><div><div style="font-size:15px;font-weight:700;color:#991b1b">${reason}</div><div style="font-size:12px;color:#b91c1c;margin-top:2px">学校はお休みです！</div></div></div>`;
  }
  const events=[];
  routines.forEach(r=>events.push({time:r.time,end:mt(tm(r.time)+r.dur),title:r.name,type:'routine'}));
  const maxP=isSat?SAT_MAX:PERIODS.length;
  const dayClasses=(!off&&dow>=1&&dow<=6)?classes.filter(c=>c.day==dow&&c.period<maxP):[];
  dayClasses.forEach(c=>{const p=PERIODS[c.period];events.push({time:p.s,end:p.e,title:c.sub,type:'class',period:c.period});});
  tasks.filter(t=>!t.done).forEach(t=>events.push({time:t.time,end:mt(tm(t.time)+30),title:t.text,type:'todo'}));
  const START_H=4,END_H=22;
  const now=new Date();
  const nowMin=now.getHours()*60+now.getMinutes();
  const isToday2=(selDS===toDS(now));
  let tl=`<div class="timeline-wrap">`;
  for(let h=START_H;h<=END_H;h++){
    const hMin=h*60;
    const blocksHere=events.filter(e=>tm(e.time)>=hMin&&tm(e.time)<hMin+60);
    let nowLine='';
    if(isToday2&&nowMin>=hMin&&nowMin<hMin+60){
      const pct=((nowMin-hMin)/60)*100;
      nowLine=`<div class="tl-now-line" style="top:${pct}%"><div class="tl-now-dot"></div></div>`;
    }
    const bHtml=blocksHere.map(e=>`<div class="ev ev-${e.type}"${e.type==='class'?' onclick="toggleSchool()"':''}><div class="ev-title">${e.title}</div><div class="ev-time">${e.time} – ${e.end}</div></div>`).join('');
    tl+=`<div class="tl-row"><div class="tl-label">${z(h)}:00</div><div class="tl-track" style="position:relative">${nowLine}${bHtml}</div></div>`;
  }
  tl+=`</div>`;
  inner+=tl;
  if(dayClasses.length>0){
    const rows=dayClasses.map(c=>{const p=PERIODS[c.period];return`<div class="sp-row"><div class="dot" style="background:#4f46e5"></div><div style="flex:1"><div style="font-size:14px;font-weight:600">${c.sub}</div><div style="font-size:11px;color:var(--muted)">${p.l} · ${p.s}–${p.e}</div></div><span class="pill pill-blue">${p.l}</span></div>`;}).join('');
    const subLabel=`${dayClasses.length}科目`;
    inner+=`<div class="school-toggle" id="school-toggle" onclick="toggleSchool()"><div class="school-toggle-left"><div class="school-toggle-icon"><i class="ti ti-school"></i></div><div><div class="school-toggle-label">今日の授業</div><div class="school-toggle-sub">${subLabel}</div></div></div><i class="ti ti-chevron-down school-toggle-arrow" id="school-toggle-arrow"></i></div><div class="school-panel" id="school-panel">${rows}</div>`;
  }
  const t0=new Date();t0.setHours(0,0,0,0);
  const up=tests.slice().sort((a,b)=>a.start.localeCompare(b.start)).filter(t=>{const e=new Date(t.end);e.setHours(0,0,0,0);return e>=t0;}).slice(0,4);
  if(up.length){
    inner+=`<div class="sec-title">テストまでの日数</div><div class="cd-grid">`+up.map(t=>{
      const ds=new Date(t.start);ds.setHours(0,0,0,0);
      const de=new Date(t.end);de.setHours(0,0,0,0);
      const dfs=Math.round((ds-t0)/86400000),dfe=Math.round((de-t0)/86400000);
      const ongoing=dfs<=0&&dfe>=0;
      const span=t.start===t.end?t.start:`${t.start}〜${t.end}`;
      return`<div class="cd-card"><div style="font-size:13px;font-weight:600;margin-bottom:5px">${t.sub}</div><div class="cd-num ${dfs<=3&&!ongoing?'urgent':''}">${ongoing?'中':dfs<=0?'0':dfs}</div><div style="font-size:11px;color:var(--muted);margin-top:4px">${ongoing?'🔥 実施中':dfs===0?'今日から！':dfs+'日後'}</div><div style="font-size:10px;color:var(--muted);margin-top:2px">${span}</div></div>`;
    }).join('')+'</div>';
  }
  inner+=`<button class="print-btn" onclick="doPrint()"><i class="ti ti-printer"></i> 今日の予定を印刷する</button>`;
  document.getElementById('today-inner').innerHTML=inner;
  if(isToday2){setTimeout(()=>{const cont=document.querySelector('.content');const rows=document.querySelectorAll('.tl-row');if(rows.length>0){const rowH=rows[0].offsetHeight||56;cont.scrollTop=rowH*Math.max(0,now.getHours()-START_H-1);}},100);}
}

function buildTT(){
  const now=new Date(),td=now.getDay();
  let h='<div class="tt-head tt-head-empty"></div>';
  DAYS_WD.forEach(({d,l})=>{h+=`<div class="tt-head ${d===td?'tcol':''}">${l}${d===6?'<br><span style="font-size:8px">〜4限</span>':''}</div>`;});

    h+=`<div class="tt-time-cell"><div class="t-limit">${p.l}</div><div class="t-range">${p.s}</div><div class="t-sep">–</div><div class="t-range">${p.e}</div></div>`;
    DAYS_WD.forEach(({d})=>{
      const satOff=d===6&&pi>=SAT_MAX;
      const c=classes.find(c=>c.day==d&&c.period==pi);

      h+=`<div class="tt-cell ${d===td?'tcol':''} ${satOff?'off':''}">${satOff?'':c?`<div class="tt-item" onclick="askDelClass(${idx})">${c.sub}</div>`:''}</div>`;

}

function doPrint(){
  const dow=selDow,isSat=dow===6,off=isOff(selDS);
  const p=selDS.split('-');
  const dl=`${p[0]}年${parseInt(p[1])}月${parseInt(p[2])}日（${DN[dow]}）`;
  const maxP=isSat?SAT_MAX:PERIODS.length;
  const dc=(!off&&dow>=1&&dow<=6)?classes.filter(c=>c.day==dow&&c.period<maxP):[];
  const cR=dc.map(c=>{const pp=PERIODS[c.period];return`<div class="print-row"><div class="print-period-label">${pp.l}</div><div class="print-time">${pp.s}–${pp.e}</div><div class="print-subject">${c.sub}</div></div>`;}).join('')||'<div class="print-row" style="color:#999;font-size:13px">（授業なし）</div>';
  const rR=routines.map(r=>`<div class="print-routine-row"><div class="print-routine-time">${r.time}</div><div class="print-routine-name">${r.name}</div><div class="print-routine-dur">${r.dur}分</div></div>`).join('')||'<div class="print-row" style="color:#999;font-size:13px">（なし）</div>';
  const tR=tasks.filter(t=>!t.done).map(t=>`<div class="print-task-row"><div class="print-routine-time">${t.time}</div><div class="print-routine-name">□ ${t.text}</div></div>`).join('')||'<div class="print-row" style="color:#999;font-size:13px">（なし）</div>';
  const t0=new Date();t0.setHours(0,0,0,0);
  const up=tests.filter(t=>{const e=new Date(t.end);e.setHours(0,0,0,0);return e>=t0;}).slice(0,5);
  const teR=up.map(t=>{const ds=new Date(t.start);ds.setHours(0,0,0,0);const df=Math.round((ds-t0)/86400000);return`<div class="print-row"><span style="font-weight:600">${t.sub}</span><span>${t.start}〜${t.end}</span><span>${df<=0?'実施中':df+'日後'}</span></div>`;}).join('')||'<div class="print-row">（なし）</div>';
  const pa=document.getElementById('print-area');
  pa.innerHTML=`<div class="print-header"><div style="font-size:20px;font-weight:700">📚 学習プランナー</div><div style="font-size:14px;color:#555;margin-top:2px">${dl}</div></div><div class="print-section"><h3>📖 今日の時間割</h3>${cR}</div><div class="print-section"><h3>🔄 ルーティーン</h3>${rR}</div><div class="print-section"><h3>✅ やること</h3>${tR}</div><div class="print-section"><h3>🎯 テストカウントダウン</h3>${teR}</div><div style="margin-top:20px;font-size:10px;color:#aaa;text-align:right">印刷日時: ${new Date().toLocaleString('ja-JP')}</div>`;
  pa.style.display='block';window.print();setTimeout(()=>{pa.style.display='none';},500);
}
const now=new Date();
selDow=now.getDay();selDS=toDS(now);
document.getElementById('page-big').textContent=`${now.getMonth()+1}月${now.getDate()}日`;
buildWeek();buildToday();
initAuth(); // Supabase セッション復元
</script>
