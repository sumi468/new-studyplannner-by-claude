<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>NEXA</title>
<!-- PWA -->
<meta name="application-name" content="NEXA" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="NEXA" />
<meta name="theme-color" content="#2563FF" />
<!-- フォント -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%232563FF' width='100' height='100'/><text x='50' y='70' font-size='60' font-weight='bold' text-anchor='middle' fill='white' font-family='Manrope'>N</text></svg>" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --acc:#2563FF;
  --acc2:#2563FF;
  --acc-soft:#EEF3FF;
  --bg:#F6F8FC;
  --surface:#FFFFFF;
  --border:#E4E8F0;
  --text:#0F172A;
  --muted:#64748B;
  --r:16px;
  --rsm:10px;
  --shadow:0 1px 4px rgba(15,23,42,.06),0 0 0 1px rgba(15,23,42,.04);
}
html,body{height:100%;background:#E8ECF4;overflow:hidden;}
body{display:flex;align-items:center;justify-content:center;font-family:'Inter',-apple-system,'SF Pro Display',BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased}
.app-shell{width:100%;max-width:430px;height:100dvh;max-height:100dvh;background:var(--bg);border-radius:var(--r);overflow:hidden;border:0.5px solid var(--border);display:flex;flex-direction:column;box-shadow:0 8px 40px rgba(30,50,120,.15)}
@media(max-width:500px){.app-shell{border-radius:0;max-height:100dvh;border:none;min-height:100dvh}}
@media(min-width:768px){
  body{background:#D8DDE8}
  .app-shell{max-width:820px;height:94dvh;max-height:94dvh;border-radius:20px}
  #view-school{display:none;flex-direction:row;gap:0;overflow:hidden}
  #view-school.active{display:flex}
  #view-school .tt-wrap{flex:1 1 auto;overflow-y:auto;padding:20px 16px 24px}
  .tt-school-side{width:240px;flex-shrink:0;border-left:1px solid var(--border);overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:14px;background:var(--bg)}
  .settings-wrap{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:20px 20px 32px}
  .acct-card,.acct-login-btn{grid-column:1/-1}
  .settings-card{margin-bottom:0}
  .sf-row2{flex-direction:row}
  .sf-row2>div{flex:1;min-width:0}
  .tt-cell{min-height:72px}
  .tt-item{font-size:10px;padding:7px 6px 5px}
  .tt-grid{grid-template-columns:44px repeat(6,1fr);gap:5px}
  .tt-head{font-size:12px}
  .tt-time-cell .t-limit{font-size:11px}
  .tt-time-cell .t-range{font-size:8px}
}
@media(min-width:1200px){
  body{background:#D0D8E8}
  .app-shell{max-width:100%;width:100%;height:100dvh;max-height:100dvh;border-radius:0;border:none;box-shadow:none;}
  #view-school{overflow:hidden;max-height:calc(100dvh - 120px)}
  #view-school .tt-wrap{padding:20px 28px 32px;flex:1;overflow:auto}
  .tt-school-side{width:320px;padding:24px 22px;display:flex!important;flex-direction:column;gap:4px}
  .tt-grid{gap:8px;grid-template-columns:54px repeat(6,1fr);min-width:unset;width:100%}
  .tt-cell{min-height:90px}
  .tt-item{font-size:12px;padding:10px 9px 8px;border-left-width:3px}
  .tt-item-name{font-size:12px;font-weight:700}
  .tt-item-time{font-size:10px}
  .tt-time-cell .t-limit{font-size:13px}
  .tt-time-cell .t-range{font-size:9px}
  .tt-head{font-size:14px;padding:8px 4px 14px;letter-spacing:.04em}
  .settings-wrap{grid-template-columns:1fr 1fr 1fr;padding:28px 32px 48px;gap:20px}
  .topbar{padding:16px 28px 0}
  .page-big{font-size:32px}
  .bottomnav{padding-left:28px;padding-right:28px;max-width:600px;margin:0 auto;width:100%;}
  #view-today{max-width:860px;margin:0 auto}
  .content{overflow-y:auto}
  #tt-today-card{padding:16px 20px 0;}
  .today-class-card{padding:18px 22px 20px;}
  .today-class-card-list{grid-template-columns:repeat(4,1fr);}
}
.topbar{background:var(--surface);padding:14px 18px 0;border-bottom:0.5px solid var(--border);flex-shrink:0}
.topbar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;}
.page-small{font-size:12px;font-weight:600;color:var(--acc);letter-spacing:.04em;text-transform:uppercase;margin-bottom:1px}
.page-big{font-size:26px;font-weight:800;letter-spacing:-.5px;transition:opacity .22s,transform .22s;font-family:'Manrope',sans-serif}
.top-right{display:flex;gap:6px;align-items:center;flex-shrink:0;}
.icon-btn{width:38px;height:38px;border-radius:50%;background:var(--acc-soft);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--acc);font-size:18px;transition:background .22s,transform .28s}
.icon-btn:hover{background:#d4e4fd;box-shadow:0 2px 10px rgba(26,110,247,.2)}
.icon-btn:active{transform:scale(.88)}
.fab{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:white;font-size:18px;box-shadow:0 2px 8px rgba(37,99,255,.2);transition:transform .28s,box-shadow .28s}
.fab:hover{transform:scale(1.08);box-shadow:0 6px 20px rgba(26,110,247,.45)}
.fab:active{transform:scale(.88);box-shadow:0 2px 8px rgba(26,110,247,.2)}
.mode-strip{display:flex;background:var(--bg);border-radius:50px;padding:3px;margin-bottom:10px;border:0.5px solid var(--border)}
.mode-btn{flex:1;padding:5px 0;font-size:12px;font-weight:500;border:none;background:none;cursor:pointer;border-radius:50px;color:var(--muted);font-family:inherit;transition:background .28s,color .28s}
.mode-btn.active{background:var(--surface);color:var(--acc);box-shadow:var(--shadow)}
.mode-btn:active{transform:scale(.95)}
.week-strip{display:flex;gap:1px}
.wd{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0 10px;flex:1;cursor:pointer;border-bottom:2.5px solid transparent;transition:border-color .35s}
.wd.active{border-bottom-color:var(--acc)}
.wd-label{font-size:10px;color:var(--muted)}
.wd.active .wd-label{color:var(--acc)}
.wd.sat .wd-label{color:#2563eb}
.wd.hol .wd-label,.wd.sun .wd-label{color:#dc2626}
.wd-num{width:27px;height:27px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;transition:background .3s cubic-bezier(.34,1.56,.64,1),color .3s}
.wd.active .wd-num{background:var(--acc);color:white;transform:scale(1.15)}
.wd.today-dot .wd-num{background:rgba(26,110,247,.13);color:var(--acc);border-radius:50%;}
.wd.sun .wd-num,.wd.hol .wd-num{color:#dc2626}
.wd.sat .wd-num{color:#2563eb}
.content{flex:1;overflow-y:auto;background:var(--bg);position:relative}
.view{display:none}
.view.active{display:block}
.bottomnav{display:flex;background:var(--surface);border-top:0.5px solid var(--border);padding:6px 4px 0;padding-bottom:calc(6px + env(safe-area-inset-bottom));flex-shrink:0;min-height:calc(56px + env(safe-area-inset-bottom))}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:none;background:none;cursor:pointer;padding:4px 0;color:var(--muted);font-size:10px;font-family:inherit;transition:color .22s}
.bnav-btn i{font-size:21px;padding:3px 13px;border-radius:50px;transition:background .28s,transform .35s cubic-bezier(.34,1.56,.64,1)}
.bnav-btn.active{color:var(--acc)}
.bnav-btn.active i{background:var(--acc-soft);transform:translateY(-2px) scale(1.08)}
.bnav-btn:active{transform:scale(.88)}
.card{background:var(--surface);border-radius:var(--r);margin:0 12px 12px;border:0.5px solid var(--border);overflow:hidden;box-shadow:var(--shadow)}
.card-row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:0.5px solid var(--border);transition:background .22s,transform .22s}
.card-row:active{background:var(--acc-soft);transform:scale(.99)}
.card-row:last-child{border-bottom:none}
.sec-title{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;padding:14px 16px 7px}
.drawer-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.4);align-items:flex-end;backdrop-filter:blur(3px);z-index:100}
.drawer-overlay.open{display:flex;animation:fadeIn .28s ease}
.drawer{background:var(--surface);border-radius:var(--r) var(--r) 0 0;padding:20px;width:100%;max-width:430px;margin:0 auto;animation:drawerUp .44s cubic-bezier(.16,1,.3,1)}
.drawer-title{font-size:17px;font-weight:700;margin-bottom:16px;color:var(--text)}
.dw-input{width:100%;font-size:14px;padding:11px 14px;border:0.5px solid var(--border);border-radius:14px;background:var(--bg);color:var(--text);font-family:inherit;transition:border-color .2s}
.dw-input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(26,110,247,.12)}
.dw-row{display:flex;gap:8px;margin-top:4px}
.dw-cancel{flex:1;padding:11px;border:0.5px solid var(--border);border-radius:50px;background:none;cursor:pointer;font-family:inherit;font-size:13px;color:var(--muted)}
.dw-submit{flex:2;padding:11px;background:#2563FF;color:white;border:none;border-radius:50px;cursor:pointer;font-family:inherit;font-size:14px;font-weight:600;box-shadow:0 2px 8px rgba(37,99,255,.2);transition:background .22s,transform .22s}
.dw-submit:hover{background:#1d4ed8;transform:translateY(-1px)}
.dw-submit:active{transform:scale(.96)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes drawerUp{from{transform:translateY(100%);opacity:0}to{transform:none;opacity:1}}
#nexa-splash{position:fixed;inset:0;z-index:9999;background:linear-gradient(160deg,#f8faff 0%,#eef3ff 60%,#e6edff 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;animation:splashFadeIn .35s ease both;pointer-events:all;}
#nexa-splash.fade-out{animation:splashFadeOut .5s ease forwards;}
@keyframes splashFadeIn{from{opacity:0}to{opacity:1}}
@keyframes splashFadeOut{from{opacity:1;transform:none}to{opacity:0;transform:scale(1.015)}}
.splash-logo-wrap{width:min(160px,38vw);height:min(160px,38vw);display:flex;align-items:center;justify-content:center;margin-bottom:28px;}
.splash-logo-wrap img{width:100%;height:100%;object-fit:contain;border-radius:28%;box-shadow:0 12px 40px rgba(37,99,255,.18),0 2px 8px rgba(37,99,255,.10);}
.splash-brand{font-family:'Manrope',sans-serif;font-size:clamp(32px,8vw,44px);font-weight:800;letter-spacing:-.04em;color:#0f172a;line-height:1;margin-bottom:10px;}
.splash-brand .splash-x{color:#2563FF;font-weight:800;}
.splash-dots{font-family:'Manrope',sans-serif;font-size:clamp(10px,2.5vw,13px);font-weight:600;letter-spacing:.45em;color:#64748b;margin-bottom:16px;text-transform:uppercase;}
.splash-tagline{font-family:'Inter',sans-serif;font-size:clamp(10px,2.2vw,12px);font-weight:400;color:#94a3b8;letter-spacing:.02em;text-align:center;max-width:280px;line-height:1.5;}
.settings-wrap{padding:12px 12px 24px}
.settings-card{background:var(--surface);border-radius:var(--r);border:0.5px solid var(--border);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.settings-card-header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border);background:var(--surface)}
.settings-card-header i{font-size:18px;color:var(--acc)}
.settings-card-header-text{font-size:15px;font-weight:700;color:var(--text)}
.settings-card-body{padding:14px 16px}
.sf-label{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px;margin-top:10px;display:block}
.sf-label:first-child{margin-top:0}
.sf-input{width:100%;font-size:13px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font-family:inherit;transition:border-color .2s}
.sf-input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(37,99,255,.10)}
.sf-btn{width:100%;margin-top:12px;padding:11px;background:#2563FF;color:white;border:none;border-radius:50px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:transform .22s,box-shadow .22s}
.sf-btn:hover{box-shadow:0 4px 16px rgba(37,99,255,.35);transform:translateY(-1px);background:#1d4ed8}
.sf-btn:active{transform:scale(.97)}
.auth-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);align-items:center;justify-content:center;backdrop-filter:blur(6px);z-index:300;padding:20px}
.auth-overlay.open{display:flex;animation:fadeIn .28s ease}
.auth-modal{background:var(--surface);border-radius:24px;padding:28px 22px 22px;width:100%;max-width:340px;box-shadow:0 24px 64px rgba(15,23,42,.22);animation:modalUp .4s cubic-bezier(.16,1,.3,1)}
@keyframes modalUp{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
.auth-title{font-size:22px;font-weight:800;text-align:center;color:var(--text);margin-bottom:4px;font-family:'Manrope',sans-serif;letter-spacing:-.3px}
.auth-sub{font-size:13px;color:var(--muted);text-align:center;margin-bottom:20px}
.auth-input{width:100%;font-size:14px;padding:11px 14px;border:0.5px solid var(--border);border-radius:14px;background:var(--bg);color:var(--text);font-family:inherit;transition:border-color .22s;margin-bottom:12px}
.auth-input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(26,110,247,.12)}
.auth-btn{width:100%;padding:13px;background:#2563FF;color:white;border:none;border-radius:50px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;box-shadow:0 2px 8px rgba(37,99,255,.2);transition:background .22s,transform .22s}
.auth-btn:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(37,99,255,.35);background:#1d4ed8}
.auth-btn:active{transform:scale(.97)}
.auth-err{font-size:12px;color:#dc2626;text-align:center;margin-top:8px;min-height:18px}
.acct-card{background:#2563FF;border-radius:var(--r);margin:0 0 16px;padding:18px;color:white;box-shadow:0 4px 14px rgba(37,99,255,.25)}
.acct-email{font-size:14px;font-weight:600;margin-bottom:10px}
.acct-btns{display:flex;gap:8px}
.acct-sync-btn{flex:2;padding:9px;background:rgba(255,255,255,.2);border:0.5px solid rgba(255,255,255,.3);border-radius:50px;color:white;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:background .22s}
.acct-sync-btn:hover{background:rgba(255,255,255,.3)}
.acct-out-btn{flex:1;padding:9px;background:rgba(255,255,255,.12);border:0.5px solid rgba(255,255,255,.25);border-radius:50px;color:white;font-family:inherit;font-size:12px;cursor:pointer;transition:background .22s}
.acct-out-btn:hover{background:rgba(255,255,255,.22)}
.acct-login-btn{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--surface);border-radius:var(--r);border:0.5px solid var(--border);box-shadow:var(--shadow);cursor:pointer}
.acct-login-btn:active{background:var(--acc-soft)}
.auth-close-btn{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;background:var(--bg);border:0.5px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:18px;transition:background .22s}
.auth-close-btn:hover{background:var(--border);color:var(--text)}
.auth-close-btn:active{transform:scale(.9)}
</style>
</head>
<body>

<div id="nexa-splash">
  <div class="splash-logo-wrap">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" width="100" height="100">
      <rect fill="#2563FF" width="100" height="100" rx="28"/>
      <text x="50" y="72" font-size="60" font-weight="800" text-anchor="middle" fill="white" font-family="Manrope">N</text>
    </svg>
  </div>
  <div class="splash-brand">NE<span class="splash-x">X</span>A</div>
  <div class="splash-dots">N · E · X · A</div>
  <div class="splash-tagline">Next Edition eXperience<br>for Academic Life</div>
</div>

<div class="app-shell">
  <div class="topbar">
    <div class="topbar-head">
      <div>
        <div class="page-small" id="page-small">今日</div>
        <div class="page-big" id="page-big">12月 15日</div>
      </div>
      <div class="top-right">
        <button class="icon-btn" onclick="alert('機能準備中')" aria-label="前へ"><i class="ti ti-chevron-left"></i></button>
        <button class="icon-btn" onclick="alert('機能準備中')" aria-label="次へ"><i class="ti ti-chevron-right"></i></button>
        <button class="icon-btn" onclick="alert('印刷機能準備中')" aria-label="印刷"><i class="ti ti-printer"></i></button>
        <button class="fab" onclick="openDrawer()" aria-label="タスク追加"><i class="ti ti-plus"></i></button>
      </div>
    </div>
    <div class="mode-strip">
      <button class="mode-btn active" onclick="setMode('week')">週</button>
      <button class="mode-btn" onclick="setMode('month')">月</button>
    </div>
  </div>
  <div class="content">
    <div class="view active" id="view-today">
      <div style="padding:16px 14px">
        <div class="card">
          <div class="card-row">
            <div>
              <div style="font-size:13px;font-weight:600;color:var(--text)">今日のスケジュール</div>
              <div style="font-size:11px;color:var(--muted);margin-top:4px">10:30 - 11:15 数学 (3限)</div>
              <div style="font-size:11px;color:var(--muted);margin-top:2px">13:40 - 14:25 英語 (6限)</div>
            </div>
          </div>
          <div class="card-row">
            <div style="color:var(--acc);font-weight:600">+ タスクを追加</div>
          </div>
        </div>
      </div>
    </div>
    <div class="view" id="view-school">
      <div style="padding:14px;text-align:center;color:var(--muted)">時間割 - 機能準備中</div>
    </div>
    <div class="view" id="view-routine">
      <div style="padding:14px;text-align:center;color:var(--muted)">ルーティーン - 機能準備中</div>
    </div>
    <div class="view" id="view-task">
      <div style="padding:14px;text-align:center;color:var(--muted)">タスク - 機能準備中</div>
    </div>
    <div class="view" id="view-settings">
      <div class="settings-wrap">
        <div class="settings-card">
          <div class="settings-card-header">
            <i class="ti ti-user"></i>
            <div class="settings-card-header-text">アカウント</div>
          </div>
          <div class="settings-card-body">
            <div class="acct-login-btn" onclick="openAuth()">
              <span style="color:var(--acc);font-weight:600">ログインしてデータを同期</span>
              <i class="ti ti-chevron-right" style="color:var(--muted)"></i>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="bottomnav">
    <button class="bnav-btn active" onclick="setTab('today')"><i class="ti ti-calendar-event"></i>今日</button>
    <button class="bnav-btn" onclick="setTab('school')"><i class="ti ti-school"></i>時間割</button>
    <button class="bnav-btn" onclick="setTab('routine')"><i class="ti ti-refresh"></i>ルーティーン</button>
    <button class="bnav-btn" onclick="setTab('task')"><i class="ti ti-checkbox"></i>タスク</button>
    <button class="bnav-btn" onclick="setTab('settings')"><i class="ti ti-settings"></i>設定</button>
  </div>
</div>

<div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer()">
  <div class="drawer" onclick="event.stopPropagation()">
    <div class="drawer-title">タスクを追加</div>
    <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px;font-weight:600">内容</label>
    <input class="dw-input" type="text" id="dw-text" placeholder="例: 数学 練習問題 p.32" />
    <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px;font-weight:600">時刻</label>
    <input class="dw-input" type="time" id="dw-time" value="18:00" />
    <div class="dw-row">
      <button class="dw-cancel" onclick="closeDrawer()">キャンセル</button>
      <button class="dw-submit" onclick="addTask()">追加する</button>
    </div>
  </div>
</div>

<div class="auth-overlay" id="auth-overlay" onclick="closeAuth(event)">
  <div class="auth-modal" onclick="event.stopPropagation()">
    <button class="auth-close-btn" onclick="closeAuth()"><i class="ti ti-x"></i></button>
    <div class="auth-title">NEXA</div>
    <div class="auth-sub">アカウントでデータをデバイス間同期</div>
    <input class="auth-input" type="email" id="auth-email" placeholder="メールアドレス" autocomplete="email"/>
    <input class="auth-input" type="password" id="auth-password" placeholder="パスワード（6文字以上）" autocomplete="current-password"/>
    <button class="auth-btn" onclick="doAuth()">ログイン</button>
    <div class="auth-err" id="auth-err"></div>
  </div>
</div>

<script>
let currentTab = 'today';

// Splash screen
window.addEventListener('load', function() {
  const splash = document.getElementById('nexa-splash');
  setTimeout(() => {
    splash.classList.add('fade-out');
    setTimeout(() => splash.remove(), 500);
  }, 1500);
});

// Tab navigation
function setTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.bnav-btn').forEach(b => b.classList.remove('active'));
  
  document.getElementById('view-' + tab).classList.add('active');
  event.target.closest('.bnav-btn').classList.add('active');
  
  const titles = {
    today: '今日',
    school: '時間割',
    routine: 'ルーティーン',
    task: 'タスク',
    settings: '設定'
  };
  document.getElementById('page-big').textContent = titles[tab];
}

// Drawer
function openDrawer() {
  document.getElementById('drawer-overlay').classList.add('open');
}

function closeDrawer() {
  document.getElementById('drawer-overlay').classList.remove('open');
}

function addTask() {
  const text = document.getElementById('dw-text').value;
  const time = document.getElementById('dw-time').value;
  if (text.trim()) {
    alert(`タスク追加: ${text} at ${time}`);
    document.getElementById('dw-text').value = '';
    document.getElementById('dw-time').value = '18:00';
    closeDrawer();
  }
}

// Auth
function openAuth() {
  document.getElementById('auth-overlay').classList.add('open');
}

function closeAuth(e) {
  if (!e || e.target.id === 'auth-overlay') {
    document.getElementById('auth-overlay').classList.remove('open');
  }
}

function doAuth() {
  const email = document.getElementById('auth-email').value;
  const password = document.getElementById('auth-password').value;
  if (email && password) {
    alert(`ログイン試行: ${email}`);
  } else {
    document.getElementById('auth-err').textContent = 'メールとパスワードを入力してください';
  }
}

// Mode
function setMode(mode) {
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  alert(`${mode === 'week' ? '週' : '月'}ビューに切り替え`);
}
</script>
</body>
</html>
